name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  select-mode:
    name: Select release mode
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.mode.outputs.mode }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Select mode
        id: mode
        uses: changesets/action/select-mode@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1

  version:
    name: Update release pull request
    needs: select-mode
    if: github.ref == 'refs/heads/main' && needs.select-mode.outputs.mode == 'version'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Open or update release pull request
        uses: changesets/action/version@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          script: pnpm release:version
          commit-message: |-
            chore: version packages

            Signed-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          pr-title: "chore: release packages"

  publish:
    name: Publish approved beta
    needs: select-mode
    if: github.ref == 'refs/heads/main' && needs.select-mode.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.19.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run release checks
        run: pnpm check

      - name: Check approved version
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm release:check

      - name: Pack and publish core package
        run: pnpm release:publish

      - name: Build GitHub Release notes
        run: pnpm release:notes > release-notes.md

      - name: Create Git tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: >-
          gh release create "$RELEASE_TAG"
          --target "$GITHUB_SHA"
          --title "$RELEASE_TAG"
          --notes-file release-notes.md
