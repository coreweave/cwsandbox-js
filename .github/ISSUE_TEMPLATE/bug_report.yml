name: Bug report
description: Something is broken or unexpected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report.

  - type: textarea
    id: description
    attributes:
      label: What happened?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: How can we reproduce it?
      description: Steps, code, or a minimal example.
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Package version, runtime, OS — whatever is relevant.
      placeholder: |
        Package:
        Node:
        OS:
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Anything else?
    validations:
      required: false
